[project]
name = "publishable"
version = "0.1.0"
description = "Run experiments so the record is publishable by default"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "numpy>=1.26", "scipy>=1.11", "pyarrow>=15.0"]

[project.scripts]
publishable = "publishable.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/publishable"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "types-pyyaml>=6.0"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src"]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: exercises real uv or network"]
