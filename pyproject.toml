[project]
name = "publishable"
version = "0.2.4"
description = "Run experiments so the record is publishable by default"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kyungjoon Lee", email = "joon_lee@hms.harvard.edu" },
]
keywords = [
    "reproducibility",
    "research-software",
    "experiments",
    "provenance",
    "preregistration",
    "open-science",
]
# `Development Status :: 4 - Beta` is README's own v0.x notice in trove
# vocabulary — *"the design is settled, interfaces may still shift before
# 1.0"* — and the command surface is complete, which is what separates Beta
# from Alpha here. The only Python version claimed is 3.11, which
# `requires-python` already carries and which the test suite actually runs on;
# a classifier for a version nothing runs against is an undated build claim in
# the one file installers read.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyarrow>=15.0",
    "python-dotenv>=1.2.3",
]

[project.urls]
Homepage = "https://github.com/seouri/publishable"
Repository = "https://github.com/seouri/publishable"
Documentation = "https://github.com/seouri/publishable/blob/main/docs/reference.md"
Issues = "https://github.com/seouri/publishable/issues"

[project.scripts]
publishable = "publishable.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/publishable"]
# The shipped scaffolds (`readme_templates/*.tmpl`) are data, not modules:
# `scaffold_project` reads them through `importlib.resources` at scaffold
# time, so a wheel that omitted them would raise on someone else's machine
# the first time they ran `publishable new`. Declared rather than left to
# the default inclusion, which is a property of how the build backend is
# configured today.
artifacts = ["src/publishable/readme_templates/*.tmpl", "src/publishable/py.typed"]

# Without an explicit sdist target, hatchling's default sweeps the whole
# working tree into the tarball — `.claude/`, `.superpowers/sdd/` and
# `docs/superpowers/` are the development record, tracked deliberately for
# this repository and not something a downstream build needs.
#
# `tests/` is deliberately NOT here, and it was measured rather than assumed:
# the suite was included, the sdist unpacked outside any repository, and
# `uv run pytest` run against it — 2 failed, 3566 passed, 4 skipped,
# re-measured on 2026-08-29 at 0.2.4. Both failures are properties of the
# unpacked tarball rather than of the code: one command test reaches
# `E-GIT-NO-REPO` because an unpacked sdist is not a git repository, and one
# `.parquet` golden digest moves because a fresh resolve is not this repo's
# `uv.lock`. Three of the skips are `test_scaffold.py`'s tutorial pins, whose
# subject `docs/tutorial-writing-a-plugin.md` the `include` below does not
# carry — they skip only when it is absent AND the tree is not a git checkout,
# so deleting it in a checkout still fails rather than going quiet. A suite
# that fails on unpack is worse than no suite, so the tests stay in the
# repository, where they pass.
[tool.hatch.build.targets.sdist]
include = [
    "src/publishable",
    "docs/design-principles.md",
    "docs/experimental-designs.md",
    "docs/reference.md",
    "/README.md",
    "/LICENSE",
    "/CITATION.cff",
    "/pyproject.toml",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-xdist>=3.6", "ruff>=0.6", "mypy>=1.11", "types-pyyaml>=6.0"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
# Ruff formats fenced Python inside Markdown by default, and this repo's four
# normative documents are full of it — `README.md` and `docs/reference.md` both
# carry config and step examples written for a reader, not for a formatter.
# Without this exclusion `ruff format .` rewrites them, which happened once and
# cost a repo-wide revert. Removing it puts the documents back in scope.
exclude = ["*.md"]

[tool.mypy]
files = ["src"]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: exercises real uv or network"]
# `-n 8` is the default because the suite is ~3500 tests of real git repos and
# real runs, and the serial wall clock is 6 minutes. Measured on 2026-08-29
# against an 8-core machine: 365s serial, 143s at `-n 8`. It is a plateau
# rather than a peak — `-n 4` gives 146s and `-n 6` 142s, and `-n 16` is worse
# at 174s, because each test runs ~1.8x slower under contention (aggregate call
# time goes 326s to 589s). So this buys the parallel speedup that exists on
# this hardware and stops; raising the number does not help.
#
# Override it per-invocation with `-n 0`, which runs everything in one process
# — verified to give live output under `-s` and to enter the debugger under
# `--pdb`. NOT `-p no:xdist`: unloading the plugin leaves this `-n` unparsed and
# pytest exits on a usage error before collecting anything.
addopts = ["-n", "8"]
